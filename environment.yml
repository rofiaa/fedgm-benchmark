name: fedgm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn<1.8   # authors' MW_estimation_pooled passes multi_class=, removed in 1.8
  - statsmodels
  - matplotlib
  - seaborn
  - tqdm
  - jupyterlab
  - pytest
  - rpy2
  - r-base
  - r-grf        # probability forests used by the authors' code (use_grf=True)
  # Matching (GenMatch/Match) and rgenoud have no osx-arm64 conda builds; they are
  # installed from CRAN by setup/install_r_packages.R, which needs these to compile.
  - compilers
  - make
  - pytorch      # NN membership weights; conda build, the pip wheel's bundled libomp clashes with conda's
  - pip
  - pip:
      - densratio
